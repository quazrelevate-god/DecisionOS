<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DecisionOS — Redesign Preview</title>
<style>
  body{margin:0;background:#0e0e10;color:#f4f4f5;font-family:system-ui,sans-serif;}
  header{padding:28px 32px;border-bottom:1px solid #26262b;position:sticky;top:0;background:#0e0e10;z-index:5;}
  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;}
  h1 span{color:#FF3B30;}
  p.sub{color:#a1a1aa;font-size:14px;margin:6px 0 0;}
  .menu{padding:28px 32px;border-bottom:1px solid #1c1c20;}
  .menu h2{font-size:16px;text-transform:uppercase;letter-spacing:.12em;color:#FF3B30;margin:0 0 14px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  figure{margin:0;border:1px solid #26262b;border-radius:12px;overflow:hidden;background:#000;}
  figcaption{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#a1a1aa;padding:8px 12px;border-bottom:1px solid #26262b;}
  img{display:block;width:100%;height:auto;}
  @media(max-width:900px){.row{grid-template-columns:1fr;}}
</style></head><body>
<header>
  <h1>DecisionOS — <span>Modern Redesign</span> Preview</h1>
  <p class="sub">Proposed "Optical Clarity" direction · Geist type · hairline borders · soft depth · red/black identity kept · both themes. Each menu shown Light (left) vs Dark (right).</p>
</header>
<div id="app"></div>
<script>
  const menus=[["desk","Decision Desk"],["brief","CEO Brief"],["mywork","My Work"],["people","People"],["brain","Company Brain"],["capture","Capture"],["meetings","Meeting Notes"],["settings","Settings"]];
  document.getElementById('app').innerHTML = menus.map(([k,label])=>`
    <div class="menu"><h2>${label}</h2><div class="row">
      <figure><figcaption>Light</figcaption><img loading="lazy" src="./light-${k}.png" alt="${label} light"></figure>
      <figure><figcaption>Dark</figcaption><img loading="lazy" src="./dark-${k}.png" alt="${label} dark"></figure>
    </div></div>`).join('');
</script>
</body></html>
