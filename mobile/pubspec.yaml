name: decisionos_mobile
description: "DecisionOS mobile — the operational brain for founder-led SMEs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  # State + routing
  provider: ^6.1.2
  go_router: ^14.6.2
  # Attachments — task file-uploads + Money screen ingest hero.
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  # Persist the Settings screen's Language + Appearance choices.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
