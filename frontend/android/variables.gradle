ext {
    // B19 · the host whose https links open the app (App Links).
    //
    // Set 2026-09-29, from the founder: www.decisionos.biz, CNAME'd to
    // 9iqmrlup.up.railway.app and serving. Checked before hard-coding it.
    //
    // WWW ONLY, AND DELIBERATELY. The apex decisionos.biz has an A record to
    // 69.46.46.71 and no https listener at all — a request to it does not
    // complete. Android verifies an App Link by fetching
    // https://<host>/.well-known/assetlinks.json, and BELOW ANDROID 12 a
    // single unverifiable host fails verification for EVERY host in the
    // filter. minSdk here is 24, so claiming the apex today would break the
    // www links on a large share of real phones to gain nothing.
    //
    // Add the apex to this filter only once it resolves over https and serves
    // the same assetlinks.json — and make sure invite links actually use the
    // host claimed here (the backend builds them from APP_BASE_URL). See
    // docs/DEEP_LINKS.md.
    appLinkHost = 'www.decisionos.biz'
    // PLAY-3 (2026-09-29) — the version, in ONE place.
    //
    // It lived in app/build.gradle as a hardcoded `versionCode 1`. Play
    // rejects any upload whose versionCode is not HIGHER than the last one it
    // accepted, so the second upload fails with a message about the first —
    // and the number sits in a file nobody opens between releases. Here it is
    // next to the SDK levels, which is where somebody preparing a build looks.
    //
    // BUMP versionCode ON EVERY UPLOAD TO PLAY, including a re-upload of the
    // same code to the same track. It is an integer and it only goes up;
    // versionName is the human one and can say whatever you like.
    //
    // The env overrides let CI stamp a build without editing a tracked file:
    //   ANDROID_VERSION_CODE=7 ANDROID_VERSION_NAME=1.1 ./gradlew bundleRelease
    //
    // 2026-10-09 — the defaults follow the build that goes to Play, so a plain
    // `./gradlew bundleRelease` is never a step behind what testers already
    // have. 1.0.2 (3) and 1.0.3 (4) went to phones as sideloaded APKs; 1.0.4
    // (5) was prepared for Play and superseded before upload by 1.0.5 (6),
    // which carries the audit P2/P3 fixes (2026-10-10); 1.0.5 (6) in turn was
    // superseded the same day by 1.0.6 (7), with "Your call" pinned to the
    // decision sheet's foot and the minimal dock. The first Play upload is
    // 1.0.6 (7).
    appVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "7") as Integer
    appVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0.6"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}